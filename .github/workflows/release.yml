name: Release

# 打 tag 即发布，一个 job 里做两件事，顺序固定：
#   1) npm publish —— 走 Trusted Publishing (OIDC)，仓库里没有任何长期 token
#   2) GitHub Release（附 tgz）
# 先 npm 后 Release 是故意的：反过来的话 npm 失败会留下「Release 有、npm 没有」的错位
# （0.2.0 就是这么错位的）。
#
# 两个步骤都写成幂等的：该版本已存在就跳过 / 覆盖上传，所以 workflow_dispatch 可以放心重跑。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.3）'
        required: true

permissions:
  contents: write
  # Trusted Publishing 必需：GitHub 用它为这个 job 签发短期 OIDC token，
  # npm 端凭「仓库 + 工作流文件名」核验身份。少了这一行就在 npm publish 处失败。
  id-token: write

jobs:
  release:
    # 必须 GitHub 托管 runner —— npm 不支持自托管 runner 走 OIDC。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与 CI 同一套固定版本：发布产物必须由**确定的工具链**构建出来。
      # 缓存开启的前提是仓库里有 package-lock.json（现在已提交）。
      #
      # 注意：这里**不要**加 registry-url。setup-node 见到它就会往环境里写一个占位的
      # NODE_AUTH_TOKEN，npm CLI 见到该变量会直接走 token 认证，OIDC 交换根本不会发生，
      # 表现为莫名其妙的 401/404 —— 这是配 trusted publishing 最常见的翻车点。
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm

      # OIDC 支持需要 npm >= 11.5.1（Node 22.14 起）。显式升一次，别赌 runner 自带的版本。
      - name: 升级 npm（OIDC 需要 >= 11.5.1）
        run: npm install -g 'npm@^11.5.1' && npm --version

      # 审计 F20：以前这里直接用环境里的全局工具，且只跑 2 个测试；
      # 现在走同一套安装入口 + 显式构建 + 全量离线用例（发出去的包必须与 CI 同源）。
      - name: 安装依赖
        run: node scripts/install-deps.mjs

      - name: 构建（host + client）
        run: node scripts/build.mjs

      - name: 发布前跑全量离线用例
        run: node scripts/test-offline.mjs

      # 🔴 lib/ 是**提交进仓库**的，npm pack 会原样带走 —— 产物核对必须在发布前跑，
      #    否则"源码对、产物错"（例如删功能时把通用骨架一起删了）会直接发到 npm。
      - name: 核对构建产物（与源码一致 + 关键骨架在位）
        run: node tests/check-bundle.mjs

      # tag 与 package.json 的 version 必须一致：否则会发出一个「npm 上叫 A、git 里标 B」的包，
      # 而且 npm 不允许覆盖，错了只能发新版本。
      - name: 校验 tag 与 package.json 版本一致
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          WANT="${TAG#v}"
          GOT="$(node -p "require('./package.json').version")"
          echo "tag=$WANT package.json=$GOT"
          if [ "$WANT" != "$GOT" ]; then
            echo "::error::tag($WANT) 与 package.json($GOT) 不一致，拒绝发布"
            exit 1
          fi

      - name: 发布到 npm（Trusted Publishing / OIDC）
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # 🔴 判"在不在 npm 上"的逻辑在 scripts/npm-release.mjs 里（那边有用例守）。
          #   别退回 `if npm view "<pkg>@$VERSION" version >/dev/null 2>&1; then 跳过`：
          #   那样是拿**退出码**当判据，而它对"版本不存在"并不保证非零
          #   （npm 10 冷缓存给 1、热缓存给 0；npm 11 给 1）。
          #   0.9.2 就是这样静默漏发的：跳过发布、Release 照建、步骤还报 success。
          DECISION="$(node scripts/npm-release.mjs should-publish "$VERSION")"
          echo "npm 发布决策：$DECISION"
          if [ "$DECISION" = "SKIP" ]; then
            echo "npm 上已有 $VERSION，跳过发布（重跑安全）"
            exit 0
          fi
          # 不加 --provenance：OIDC + 公共仓库会自动生成 provenance 证明，无需手动开。
          # 不加 NODE_AUTH_TOKEN：npm CLI 自动检测 OIDC 环境。
          #
          # 🔴 **staged publishing 分流**（2026-11-03 实测踩到）：
          #    npm 现在会把自动化发布**暂存**起来（"Your package is being processed…"），
          #    publish 打印 `+ pkg@ver` 并**返回 0**，但版本并不公开；staged 与已发布共用版本号索引
          #    ⇒ 重跑只会得到 `E409 Cannot publish over previously staged version`。
          #    这种情况不要 fail 整个 job（否则 Release 也建不出来），标记后交给人工 2FA 批准。
          set +e
          PUBLISH_OUT="$(npm publish --access public 2>&1)"
          PUBLISH_CODE=$?
          set -e
          echo "$PUBLISH_OUT"
          if [ $PUBLISH_CODE -ne 0 ]; then
            if echo "$PUBLISH_OUT" | grep -q 'previously staged'; then
              echo "::warning::${VERSION} 已在 npm 暂存区（需人工 2FA 批准），本次跳过发布"
              echo "STAGED=1" >> "$GITHUB_ENV"
              exit 0
            fi
            exit $PUBLISH_CODE
          fi
          if echo "$PUBLISH_OUT" | grep -q 'being processed and may take'; then
            echo "::warning::npm 把 ${VERSION} 暂存了（staged）：需维护者 2FA 批准后才公开"
            echo "STAGED=1" >> "$GITHUB_ENV"
          fi

      # 🔴 发完必须自己核实：0.9.2 的教训是"步骤 success ≠ 真的发出去了"。
      #    这一步非零就直接断在这里 ⇒ 不会再有「Release 有、npm 没有」的错位。
      - name: 核验 npm 上确实有这一版
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if node scripts/npm-release.mjs verify "$VERSION"; then
            exit 0
          fi
          # staged 分流时 npm 侧要人工批准，这里不能把整条 Release 流程拖死
          if [ "${STAGED:-0}" = "1" ]; then
            echo "::warning::npm 上还没有 ${VERSION}：它处于 staged 待批准状态"
            echo "请到 https://www.npmjs.com/settings/cv-superding/staged-packages 点 Approve（需要 2FA）"
            exit 0
          fi
          exit 1

      - name: 打包
        run: npm pack

      - name: 从 CHANGELOG 提取本版本说明
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          node tools/changelog-section.mjs "${TAG#v}" > notes.md
          echo "----- notes.md -----"
          cat notes.md

      - name: 创建 Release 并上传 tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，刷新说明并覆盖 tgz（重跑安全）"
            # ⚠️ 只 upload --clobber 的话，说明会一直停在第一次建 Release 时的那份
            #   （同版本重打 tag 追加改动时就会"页面说明与 CHANGELOG 不一致"）。
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" ./*.tgz --clobber
          else
            gh release create "$TAG" ./*.tgz \
              --title "$TAG" \
              --notes-file notes.md \
              --verify-tag
          fi
