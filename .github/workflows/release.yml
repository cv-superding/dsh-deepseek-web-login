name: Release

# 打 tag 即发布：由仓库自带的 GITHUB_TOKEN 创建 Release 并附上 tgz。
# 这样维护者不需要在本地持有个人 token。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.3）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与 CI 同一套固定版本：发布产物必须由**确定的工具链**构建出来。
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm

      # 审计 F20：以前这里直接用环境里的全局工具，且只跑 2 个测试；
      # 现在走同一套安装入口 + 显式构建 + 全量离线用例（发出去的包必须与 CI 同源）。
      - name: 安装依赖
        run: node scripts/install-deps.mjs

      - name: 构建（host + client）
        run: node scripts/build.mjs

      - name: 发布前跑全量离线用例
        run: node scripts/test-offline.mjs

      - name: 打包
        run: npm pack

      - name: 从 CHANGELOG 提取本版本说明
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          node tools/changelog-section.mjs "${TAG#v}" > notes.md
          echo "----- notes.md -----"
          cat notes.md

      - name: 创建 Release 并上传 tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" ./*.tgz \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag
