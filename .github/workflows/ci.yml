name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 三平台都跑：审计 F20 指出的正是"构建入口依赖 Unix shell"这类平台契约问题，
    # 只跑 ubuntu 是发现不了的。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 固定小版本：`node-version: 24` 会装到当时的 24.x，而 tsdown 0.22.14 要求
      # `^22.18.0 || >=24.11.0` —— 早期 24.x（如 24.0~24.10）装上了也构建不了。
      #
      # 缓存依赖 setup-node 的 `cache: npm`，它**要求仓库里有 package-lock.json**：
      # 之前没有锁文件、又开了缓存，job 直接失败（"Dependencies lock file is not found"）。
      # 现在锁文件已提交，缓存可以打开；`check-round2` 里有条守卫保证这两件事不会再次打架。
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm

      # 装依赖：有锁文件走 npm ci，没有就回退 npm install（并打印警告）。
      # --ignore-scripts 跳过 prepare，构建在下面显式做。
      - name: 安装依赖
        run: node scripts/install-deps.mjs

      - name: 构建（host + client，不依赖 Bash）
        run: node scripts/build.mjs

      # 全量离线用例：扫 tests/check-*.mjs + logic-test.mjs（新增用例自动纳入）。
      # 之前这里只列了 7 个文件名，会漏跑；probe-*.mjs 需要真实账号，不在其中。
      - name: 全量离线用例
        run: node scripts/test-offline.mjs

      # 产物核对：确认 lib/ 里确实带着关键修复（防止「改了源码没重新构建就提交」）
      - name: 产物核对
        run: node tests/check-bundle.mjs
