name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 纯逻辑断言：序列化 / 工具调用过滤（JSON+XML）/ JSON 宽容修复 / SSE 状态机 /
      # 会话生命周期（删除时机 + 失效透明重试）/ token 解包 / 掩码。
      # 直接跑源码（Node 24 原生剥离 TS 类型），不需要构建。
      - name: 纯逻辑断言
        run: node tests/logic-test.mjs

      - name: 坏 JSON 恢复回归
        run: node tests/check-badjson-recovery.mjs

      - name: DSML 前缀回归
        run: node tests/check-dsml-doubled-bars.mjs

      - name: 转写回声守卫回归
        run: node tests/check-transcript-echo.mjs

      - name: 会话生命周期回归
        run: node tests/check-session-lifecycle.mjs


      - name: 退出账号回归
        run: node tests/check-logout.mjs
      # 产物核对：确认 lib/ 里确实带着关键修复（防止「改了源码没重新构建就提交」）
      - name: 产物核对
        run: node tests/check-bundle.mjs
