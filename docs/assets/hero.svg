<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="dsh-deepseek-web-login">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#0e2a3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#243b53"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#38bdf8" stroke-width="1">
    <path d="M0 200 H1000 M0 160 H1000 M0 120 H1000"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(46 56)">
    <rect width="88" height="88" rx="22" fill="url(#accent)"/>
    <circle cx="44" cy="44" r="24" fill="none" stroke="#eaf2ff" stroke-width="3.5"/>
    <ellipse cx="44" cy="44" rx="10" ry="24" fill="none" stroke="#eaf2ff" stroke-width="3"/>
    <path d="M20 44 H68" stroke="#eaf2ff" stroke-width="3"/>
    <path d="M30 72 l10 12 -10 12" fill="none" stroke="#0b1220" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 96 h16" stroke="#0b1220" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="160" y="86" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="35" font-weight="700" fill="#f8fafc">dsh-deepseek-web-login</text>
  <text x="161" y="122" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#9fb3c8">用 chat.deepseek.com 网页版登录态驱动 DSH agent · 无需 API Key</text>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cfe3f7">
    <rect x="160" y="146" width="150" height="30" rx="15" fill="url(#chip)"/>
    <text x="178" y="166">provider: deepseek-web</text>

    <rect x="322" y="146" width="122" height="30" rx="15" fill="url(#chip)"/>
    <text x="340" y="166">PoW · SHA3 WASM</text>

    <rect x="456" y="146" width="112" height="30" rx="15" fill="url(#chip)"/>
    <text x="474" y="166">SSE 双格式</text>

    <rect x="580" y="146" width="140" height="30" rx="15" fill="url(#chip)"/>
    <text x="598" y="166">工具协议桥 ⇄ tool-call</text>

    <rect x="732" y="146" width="118" height="30" rx="15" fill="url(#chip)"/>
    <text x="750" y="166">图片上传通道</text>
  </g>

  <text x="46" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#64748b">unofficial plugin · Apache-2.0 · DSH (DeepSeek Harness)</text>
</svg>
