<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">dsh-deepseek-web-login — 用 chat.deepseek.com 网页版登录态驱动 DSH agent</title>
  <desc id="hero-desc">非官方 DSH 插件横幅：deepseek-web provider、PoW 求解、SSE 双格式、工具协议桥、图片上传通道。</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#0e2a3d"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hero-chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#243b53"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hero-clip"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#hero-bg)"/>
  <g clip-path="url(#hero-clip)">
    <ellipse cx="940" cy="20" rx="180" ry="105" fill="url(#hero-glow)"/>
    <ellipse cx="120" cy="252" rx="170" ry="80" fill="url(#hero-glow)" opacity="0.45"/>
  </g>

  <!-- logo: browser window with a login check, fully inside the tile -->
  <g transform="translate(46 54)">
    <rect width="88" height="88" rx="22" fill="url(#hero-accent)"/>
    <rect x="16" y="22" width="56" height="44" rx="9" fill="none" stroke="#f8fafc" stroke-width="5"/>
    <path d="M16 35 H72" stroke="#f8fafc" stroke-width="4"/>
    <circle cx="25.5" cy="28.5" r="2.6" fill="#f8fafc"/>
    <circle cx="35.5" cy="28.5" r="2.6" fill="#f8fafc"/>
    <path d="M31 49 L40 57 L57 43" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="160" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="35" font-weight="700" fill="#f8fafc">dsh-deepseek-web-login</text>
  <text x="160" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#9fb3c8">用 chat.deepseek.com 网页版登录态驱动 DSH agent · 无需 API Key</text>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cfe3f7">
    <g class="chip"><rect x="160" y="152" width="188" height="30" rx="15" fill="url(#hero-chip)"/><text x="176" y="172">provider: deepseek-web</text></g>
    <g class="chip"><rect x="360" y="152" width="157" height="30" rx="15" fill="url(#hero-chip)"/><text x="376" y="172">PoW · SHA3 WASM</text></g>
    <g class="chip"><rect x="529" y="152" width="100" height="30" rx="15" fill="url(#hero-chip)"/><text x="545" y="172">SSE 双格式</text></g>
    <g class="chip"><rect x="641" y="152" width="174" height="30" rx="15" fill="url(#hero-chip)"/><text x="657" y="172">工具协议桥 ⇄ tool-call</text></g>
    <g class="chip"><rect x="827" y="152" width="114" height="30" rx="15" fill="url(#hero-chip)"/><text x="843" y="172">图片上传通道</text></g>
  </g>

  <text x="46" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#93a6bb">unofficial plugin · Apache-2.0 · DSH (DeepSeek Harness)</text>
</svg>
